[package]
name = "crabefi-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable CrabEFI framebuffer, rendering and interactive setup screens"

[features]
default = []
screens = ["dep:noto-sans-mono-bitmap"]
secure-boot = []
cfr = []

[dependencies]
log = { workspace = true }
heapless = { workspace = true }
noto-sans-mono-bitmap = { optional = true, version = "0.3", default-features = false, features = [
  "regular", "bold", "size_16", "size_20", "size_24", "size_32", "unicode-basic-latin",
] }
