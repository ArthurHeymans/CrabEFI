[package]
name = "storage-security-test"
version = "0.1.0"
edition = "2021"
description = "Test EFI application for Storage Security and Pass-Through protocols"

[workspace]

[features]
# Active security/TCG transfers need capable hardware and an associated Block I/O media ID.
# Default CI validates the EFI interface and pass-through enumeration without those prerequisites.
hardware-security-probes = []

[dependencies]
r-efi = "5.3"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[profile.dev]
panic = "abort"
