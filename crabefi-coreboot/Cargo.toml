[package]
name = "crabefi-coreboot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CrabEFI as a coreboot payload binary"

[features]
default = ["bundled-runtime-image"]
bundled-runtime-image = ["crabefi/full", "crabefi/bundled-runtime-image"]
external-runtime-image = ["crabefi/full"]
# Boot Linux directly from disk on x86-64, without a UEFI environment.
native-only = ["crabefi/native-boot", "crabefi/xhci"]
# Experimental native Linux boot from ext2/3/4 on x86-64.
ext4 = ["crabefi/ext4"]
# ext boot volumes inside LUKS2, unlocked by passphrase or a systemd-tpm2
# token. Also brings up the TPM in native-only builds.
luks = ["ext4", "crabefi/luks", "crabefi/tpm"]
# Test only: check the TPM refuses the LUKS2 token after the separators.
luks-test-post-cap = ["luks", "crabefi/luks-test-post-cap"]
# Use the long-mode RDI entry for u-root/LinuxBoot instead of coreboot's
# default 32-bit stack-argument entry. Only supported on x86-64.
entry64 = []
ui = ["crabefi/ui", "crabefi/elan-i2c", "crabefi/hid-i2c"]
# Fabricate a QEMU-shaped memory map when coreboot tables are missing or
# invalid, instead of failing startup with no memory map. Useful only for
# table-less QEMU experiments; never enable for real hardware.
fallback-memory-map = []
# Bring up USB only when nothing boots without it, for the boot menu, or for a
# firmware UI request. USB keyboards then do not work in GRUB or shim.
usb-on-demand = []
# Never boot USB or removable media automatically (BootNext, BootOrder, menu
# timeout); a user may still select them in the boot menu.
external-boot-menu-only = []
# Never boot USB or removable media; takes precedence over menu-only.
external-boot-deny = []
# Count SATA ports the controller reports as hot-plug capable as internal, for
# boards that mark every connector hot-plug capable.
internal-hot-plug-sata = []
# Offer the external-boot policy in the setup menu (stricter values only).
external-boot-setting = ["crabefi/external-boot-setting"]
# DRAM does not survive a warm reset: accept capsules only as files on the
# ESP, no runtime UpdateCapsule (PlatformConfig::capsule_on_disk_only).
capsule-on-disk-only = []
# Load crabefi-mm into coreboot-owned SMRAM (coreboot PAYLOAD_MM_INTERFACE);
# needs CRABEFI_MM_ELF at build time.
payload-mm = []
# Test only: emulated A/B slots and selector in the payload MM fixture's
# spare flash (ab-update-test).
ab-test-slots = ["payload-mm"]
# Test only: reset during deferred replay before acknowledging a record.
replay-test-reset-after-persist = ["crabefi/replay-test-reset-after-persist"]
# Test only: payload MM never confirms READY_TO_BOOT, which must stop the boot.
payload-mm-test-lose-ready-to-boot = ["crabefi/payload-mm-test-lose-ready-to-boot"]
secure-boot-enforced = ["crabefi/secure-boot-enforced"]
max-log-level-error = ["crabefi/max-log-level-error"]
default-log-level-error = ["crabefi/default-log-level-error"]
# CrabEFIEventLog with coreboot's boot events (ELOG_BOOT_EVENTS) when present.
boot-event-log = ["crabefi/boot-event-log"]

[dependencies]
crabefi = { package = "crabefi-core", path = "../crabefi-core", features = [
  "global-allocator",
  "platform-entry",
] }
# Needed for coreboot table parsing and early setup
log = "0.4"
r-efi = { workspace = true }
heapless = "0.9"
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }

# ACPI table parsing and AML interpreter for platform device discovery.
# Used by the coreboot payload to discover ECAM, GIC, UART, and DSDT
# devices from ACPI tables before handing off to init_platform().
# Pin to upstream main: crates.io 6.1.1 has todo!() BankField/IndexField paths
# that panic-abort while loading AML from real firmware, and only loads
# package-element names eagerly (fails on forward references like
# \_SB.PCI0.LPCB in the coreboot DSDT/SSDT). Upstream main has both the
# BankField/IndexField support and lazy package name resolution (PR #320).
acpi = { git = "https://github.com/rust-osdev/acpi.git", rev = "cb34d9d42c8d2795bfac4955ff83b04a060a797d", default-features = false, features = [
  "alloc",
  "aml",
] }

# `cargo clippy --workspace` checks the no_std payload on the host target. The
# host-only allocator below satisfies that final binary without enabling the
# firmware allocator in std test harnesses.
[target.'cfg(not(target_os = "none"))'.dependencies]
linked_list_allocator = { version = "0.10.6", default-features = false, features = ["use_spin"] }

# Controllers of ACPI-described peripherals.
[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
crabefi-hw = { path = "../crabefi-hw" }
embedded-hal-bus = { version = "0.3", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"

[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
fdt = "0.1.5"

[build-dependencies]
cc = "1"
crabefi-runtime-abi = { path = "../crabefi-runtime-abi" }
sha2 = { version = "0.11", default-features = false }

# A test-only library exercises the real payload modules without linking its entry point.
[lib]
path = "src/table_tests.rs"
doctest = false

[[bin]]
name = "crabefi"
path = "src/main.rs"
# The no_std/no_main firmware binary cannot link Rust's host test harness.
# Host-testable leaf modules are covered by ci/run-coreboot-feature-tests.sh.
test = false
bench = false
