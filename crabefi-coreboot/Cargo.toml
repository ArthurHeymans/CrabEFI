[package]
name = "crabefi-coreboot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CrabEFI as a coreboot payload binary"

[features]
ui = ["crabefi/ui"]

[dependencies]
crabefi = { path = "..", features = ["global-allocator", "platform-entry", "coreboot-payload"] }
crabefi-drivers = { path = "../crabefi-drivers" }

# Needed for coreboot table parsing and early setup
log = "0.4"
r-efi = "5.3"
heapless = "0.8"

# ACPI table parsing and AML interpreter for platform device discovery.
# Used by the coreboot payload to discover ECAM, GIC, UART, and DSDT
# devices from ACPI tables before handing off to init_platform().
acpi = { version = "6.1", default-features = false, features = ["alloc", "aml"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"

[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
fdt = "0.1.5"

[build-dependencies]
cc = "1"

[[bin]]
name = "crabefi"
path = "src/main.rs"
