[package]
name = "crabefi-coreboot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CrabEFI as a coreboot payload binary"

[features]
ui = ["crabefi/ui"]

[dependencies]
crabefi = { package = "crabefi-core", path = "../crabefi-core", features = [
  "global-allocator",
  "platform-entry",
] }
crabefi-drivers = { path = "../crabefi-drivers" }

# Needed for coreboot table parsing and early setup
log = "0.4"
r-efi = "5.3"
heapless = "0.9"
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }

# ACPI table parsing and AML interpreter for platform device discovery.
# Used by the coreboot payload to discover ECAM, GIC, UART, and DSDT
# devices from ACPI tables before handing off to init_platform().
# Pin to upstream BankField/IndexField support; crates.io 6.1.1 has todo!()
# paths that panic-abort while loading AML from real firmware.
acpi = { git = "https://github.com/ArthurHeymans/acpi.git", rev = "4f4adebf75234b52fe54c3e6e50c2cc13be41efe", default-features = false, features = [
  "alloc",
  "aml",
] }

# `cargo clippy --workspace` checks the no_std payload on the host target. The
# host-only allocator below satisfies that final binary without enabling the
# firmware allocator in std test harnesses.
[target.'cfg(not(target_os = "none"))'.dependencies]
linked_list_allocator = { version = "0.10.6", default-features = false, features = ["use_spin"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"

[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
fdt = "0.1.5"

[build-dependencies]
cc = "1"
crabefi-runtime-abi = { path = "../crabefi-runtime-abi" }
sha2 = "0.10"

[[bin]]
name = "crabefi"
path = "src/main.rs"
# The no_std/no_main firmware binary cannot link Rust's host test harness.
# Host-testable leaf modules are covered by ci/run-coreboot-feature-tests.sh.
test = false
bench = false
