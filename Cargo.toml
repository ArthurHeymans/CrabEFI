# Workspace: core library, reusable drivers, and platform payloads are separate crates.
# xtask and test-apps are NOT workspace members (different build targets).

[workspace]
members = ["crabefi-core", "crabefi-coreboot", "crabefi-drivers"]
exclude = [
  "xtask",
  "test-apps/hello",
  "test-apps/rng-test",
  "test-apps/secure-boot-test",
  "test-apps/storage-security-test",
  "test-apps/directory-test",
  "test-apps/fw-dump",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/user/CrabEFI"

[workspace.dependencies]
r-efi = "5.3"
log = "0.4"
heapless = "0.8"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
