# Workspace: the core library and platform payloads are separate crates.
# xtask, ui-harness and test-apps are NOT workspace members (different build targets).

[workspace]
members = [
  "crabefi-bounds",
  "crabefi-core",
  "crabefi-coreboot",
  "crabefi-efi-types",
  "crabefi-hw",
  "crabefi-memmap",
  "crabefi-pkcs7",
  "crabefi-runtime-bundle",
  "crabefi-ui",
]
exclude = [
  "xtask",
  "ui-harness",
  "crabefi-runtime-abi",
  "crabefi-runtime-image",
  "test-apps/ab-update-test",
  "test-apps/boot-events-test",
  "test-apps/boot-policy-test",
  "test-apps/capsule-test",
  "test-apps/device-path-test",
  "test-apps/directory-test",
  "test-apps/fw-dump",
  "test-apps/fwui-test",
  "test-apps/hello",
  "test-apps/image-exit-test",
  "test-apps/mm-gate-test",
  "test-apps/protocol-notify-test",
  "test-apps/rng-test",
  "test-apps/runtime-image-test",
  "test-apps/secure-boot-auth-test",
  "test-apps/secure-boot-test",
  "test-apps/storage-security-test",
  "test-apps/tcg-test",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ArthurHeymans/CrabEFI"

[workspace.dependencies]
crabefi-efi-types = { path = "crabefi-efi-types" }
crabefi-pkcs7 = { path = "crabefi-pkcs7" }
crabefi-runtime-bundle = { path = "crabefi-runtime-bundle" }
r-efi = "7.1"
log = "0.4"
heapless = "0.9"
mem-barrier = "0.1"
pci_types = "0.10"
xhci = { git = "https://github.com/ArthurHeymans/xhci", rev = "ee9fb6e2c0fddc44e7b693378ca0b952ee056008" }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "pe"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
