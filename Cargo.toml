# Workspace: core library, reusable drivers, and platform payloads are separate crates.
# xtask and test-apps are NOT workspace members (different build targets).

[workspace]
members = [
  "crabefi-core",
  "crabefi-coreboot",
  "crabefi-drivers",
  "crabefi-efi-types",
]
exclude = [
  "xtask",
  "crabefi-runtime-abi",
  "crabefi-runtime-image",
  "test-apps/hello",
  "test-apps/rng-test",
  "test-apps/secure-boot-test",
  "test-apps/storage-security-test",
  "test-apps/directory-test",
  "test-apps/fw-dump",
  "test-apps/tcg-test",
  "test-apps/runtime-image-test",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/user/CrabEFI"

[workspace.dependencies]
crabefi-efi-types = { path = "crabefi-efi-types" }
r-efi = "5.3"
log = "0.4"
heapless = "0.9"
mem-barrier = "0.1"
pci_types = "0.10"
xhci = { git = "https://github.com/ArthurHeymans/xhci", rev = "ee9fb6e2c0fddc44e7b693378ca0b952ee056008" }
object = { version = "0.39.1", default-features = false, features = ["read_core", "elf", "pe"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
