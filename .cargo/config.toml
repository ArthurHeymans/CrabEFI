# NOTE: Use the ./crabefi script to run xtask (it needs different build settings)
#
# Linker scripts are handled by crabefi-coreboot/build.rs.

# sha2_backend="soft" preserves the pre-0.11 `force-soft` behavior: pure
# software SHA-256/512 with no runtime CPU-feature dispatch. This keeps hash
# behavior deterministic in early-boot and runtime-services contexts and
# avoids compiling the x86-sha / AVX2 / ARMv8 dispatch paths into firmware.
# sha2_backend_soft="compact" selects the looped software implementation
# over the unrolled one: less .text for hash operations where firmware
# boot-time latency (not GB/s throughput) is what matters.
# Guest test apps also use software hashing: UEFI does not provide the SIMD
# execution environment assumed by the accelerated SHA-2 backends.
[target.'cfg(target_os = "uefi")']
rustflags = [
    "--cfg", "sha2_backend=\"soft\"",
    "--cfg", "sha2_backend_soft=\"compact\"",
]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "code-model=kernel",
    "--cfg", "sha2_backend=\"soft\"",
    "--cfg", "sha2_backend_soft=\"compact\"",
]

[target.aarch64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "--cfg", "sha2_backend=\"soft\"",
    "--cfg", "sha2_backend_soft=\"compact\"",
]

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-C", "relocation-model=static",
    "--cfg", "sha2_backend=\"soft\"",
    "--cfg", "sha2_backend_soft=\"compact\"",
]
