[package]
name = "crabefi-runtime-image"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
build = "build.rs"

[workspace]

[features]
default = []
secure-boot = ["dep:sha2", "dep:zeroize"]
full = ["secure-boot"]

[dependencies]
crabefi-efi-types = { path = "../crabefi-efi-types" }
crabefi-runtime-abi = { path = "../crabefi-runtime-abi" }
r-efi = "5.3"
# This crate is a standalone workspace and intentionally uses sha2 0.11 so its
# rsa 0.10 host tests share the same digest traits. Exact-pin so a new 0.11.x
# release cannot silently change the verifier's digest implementation.
sha2 = { optional = true, version = "=0.11.0", default-features = false, features = ["oid"] }
# Secret scrubbing for stack RSA buffers (core-only, no allocator needed).
zeroize = { optional = true, version = "1", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }

[dev-dependencies]
# Host-test-only signing dependency. Keep the exact prerelease pinned so test
# certificate generation does not drift independently of the verifier.
rsa = { version = "=0.10.0-rc.18", default-features = false }

[[test]]
name = "pkcs7_adversarial"
required-features = ["secure-boot"]

[[bin]]
name = "crabefi-runtime-image"
path = "src/main.rs"
test = true
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = false
