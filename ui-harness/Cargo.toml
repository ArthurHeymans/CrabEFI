[package]
name = "crabefi-ui-harness"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ArthurHeymans/CrabEFI"
description = "Simulated test host for the CrabEFI setup UI"

[dependencies]
crabefi-ui = { path = "../crabefi-ui", features = ["screens", "secure-boot", "cfr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
png = "0.18"
