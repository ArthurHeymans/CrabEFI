[package]
name = "crabefi-mm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "CrabEFI payload MM image: runs in coreboot-owned SMRAM"

# Standalone: built with build-std and a PIC code model, like crabefi-runtime-image.
[workspace]

[[bin]]
name = "crabefi-mm"
path = "src/main.rs"
test = false

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = false

[profile.dev]
panic = "abort"
