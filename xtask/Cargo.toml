[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "Build and test automation for CrabEFI"

# xtask is its own workspace root — it builds with the host stable toolchain,
# not the nightly bare-metal toolchain used by the main workspace.
[workspace]

[[bin]]
name = "crabefi-xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crabefi-runtime-abi = { path = "../crabefi-runtime-abi" }
clap = { version = "4", features = ["derive"] }
fs-err = "3"
regex = "1"
serde_json = "1"
sha2 = "0.10"
object = { version = "0.39.1", features = ["read_core", "elf"] }
tempfile = "3"
