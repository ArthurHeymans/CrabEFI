[package]
name = "crabefi-runtime-bundle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Architecture-selected normalized Runtime Services images for CrabEFI"
license.workspace = true
repository.workspace = true

[features]
default = []
secure-boot = []

[lib]
path = "src/lib.rs"

[dev-dependencies]
crabefi-runtime-abi = { path = "../crabefi-runtime-abi" }
sha2 = { version = "0.11", default-features = false }