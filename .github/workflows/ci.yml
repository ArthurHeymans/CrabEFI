name: CI

on:
  push:
    branches: [main, master, SBSA]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ── x86_64 ────────────────────────────────────────────────────────────

  clippy:
    name: Clippy (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src
          targets: x86_64-unknown-none

      - name: Run clippy
        run: cargo clippy --release --target x86_64-unknown-none -- -D warnings

  build:
    name: Build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Build release
        run: cargo build --release --target x86_64-unknown-none

      - name: Upload CrabEFI ELF
        uses: actions/upload-artifact@v4
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/crabefi
          retention-days: 7

  # x86_64 Integration tests with QEMU
  test-usb:
    name: Test x86_64 (USB Storage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v4
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run integration tests (USB)
        run: ./crabefi test --app hello --disable-kvm --timeout 120

  test-ahci:
    name: Test x86_64 (AHCI Storage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v4
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run integration tests (AHCI)
        run: ./crabefi test --app hello --ahci --disable-kvm --timeout 120

  test-nvme:
    name: Test x86_64 (NVMe Storage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v4
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run integration tests (NVMe)
        run: ./crabefi test --app hello --nvme --disable-kvm --timeout 120

  test-sdhci:
    name: Test x86_64 (SD Card Storage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v4
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run integration tests (SDHCI)
        run: ./crabefi test --app hello --sdhci --disable-kvm --timeout 120

  test-rng:
    name: Test x86_64 (RNG Protocol)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v4
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run RNG protocol tests
        run: ./crabefi test --app rng-test --disable-kvm --timeout 120

  # ── aarch64 ───────────────────────────────────────────────────────────

  clippy-aarch64:
    name: Clippy (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src
          targets: aarch64-unknown-none

      - name: Run clippy
        run: cargo clippy --release --target aarch64-unknown-none -- -D warnings

  build-aarch64:
    name: Build (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none

      - name: Build release
        run: cargo build --release --target aarch64-unknown-none

      - name: Upload CrabEFI ELF (aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: crabefi-elf-aarch64
          path: target/aarch64-unknown-none/release/crabefi
          retention-days: 7

  # aarch64 SBSA Integration tests with QEMU
  test-nvme-aarch64:
    name: Test aarch64/sbsa (NVMe Storage)
    runs-on: ubuntu-latest
    needs: build-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: aarch64-unknown-none, aarch64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF (aarch64)
        uses: actions/download-artifact@v4
        with:
          name: crabefi-elf-aarch64
          path: target/aarch64-unknown-none/release/

      - name: Run integration tests (NVMe, aarch64/sbsa)
        run: ./crabefi test --arch aarch64 --machine sbsa --app hello --nvme --disable-kvm --timeout 120

  test-rng-aarch64:
    name: Test aarch64/sbsa (RNG Protocol)
    runs-on: ubuntu-latest
    needs: build-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: aarch64-unknown-none, aarch64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF (aarch64)
        uses: actions/download-artifact@v4
        with:
          name: crabefi-elf-aarch64
          path: target/aarch64-unknown-none/release/

      - name: Run RNG protocol tests (aarch64/sbsa)
        run: ./crabefi test --arch aarch64 --machine sbsa --app rng-test --nvme --disable-kvm --timeout 120

  # ── aarch64 virt (FDT) ────────────────────────────────────────────────

  build-aarch64-virt:
    name: Build (aarch64/virt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none

      - name: Build release (virt PAYLOAD_BASE)
        run: PAYLOAD_BASE=0x62000000 cargo build --release --target aarch64-unknown-none

      - name: Upload CrabEFI ELF (aarch64-virt)
        uses: actions/upload-artifact@v4
        with:
          name: crabefi-elf-aarch64-virt
          path: target/aarch64-unknown-none/release/crabefi
          retention-days: 7

  test-nvme-aarch64-virt:
    name: Test aarch64/virt (NVMe Storage)
    runs-on: ubuntu-latest
    needs: build-aarch64-virt
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: aarch64-unknown-none, aarch64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF (aarch64-virt)
        uses: actions/download-artifact@v4
        with:
          name: crabefi-elf-aarch64-virt
          path: target/aarch64-unknown-none/release/

      - name: Run integration tests (NVMe, aarch64/virt)
        run: ./crabefi test --arch aarch64 --machine virt --app hello --nvme --disable-kvm --timeout 120
