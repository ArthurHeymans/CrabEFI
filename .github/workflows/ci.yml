name: CI

on:
  push:
    branches: [main, master, SBSA, RISCV64]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          cargo fmt --all --check
          cd "$HOME"
          cargo fmt --manifest-path "$GITHUB_WORKSPACE/xtask/Cargo.toml" -- --check
          cargo fmt --manifest-path "$GITHUB_WORKSPACE/crabefi-runtime-abi/Cargo.toml" -- --check
          cargo fmt --manifest-path "$GITHUB_WORKSPACE/crabefi-runtime-image/Cargo.toml" -- --check
          cargo fmt --manifest-path "$GITHUB_WORKSPACE/test-apps/runtime-image-test/Cargo.toml" -- --check

  coreboot-feature-tests:
    name: Coreboot feature regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run coreboot feature regression tests
        run: ci/run-coreboot-feature-tests.sh

      - name: Run runtime host tests
        run: |
          cd "$HOME"
          cargo test --manifest-path "$GITHUB_WORKSPACE/crabefi-runtime-abi/Cargo.toml"
          cargo test --manifest-path "$GITHUB_WORKSPACE/crabefi-runtime-image/Cargo.toml"

  # ── x86_64 ────────────────────────────────────────────────────────────

  clippy:
    name: Clippy (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Run clippy
        run: |
          ./crabefi build --arch x86-64
          RUNTIME_IMAGE_PATH="$PWD/target/runtime/x86_64/runtime.img" \
          RUNTIME_IMAGE_SHA256="$(tr -d '\n' < target/runtime/x86_64/sha256)" \
          cargo +nightly -Z build-std=core,compiler_builtins,alloc \
            -Z build-std-features=compiler-builtins-mem \
            clippy --workspace --release --target x86_64-unknown-none -- -D warnings
          cd "$HOME"
          cargo +nightly clippy --manifest-path "$GITHUB_WORKSPACE/crabefi-runtime-abi/Cargo.toml" -- -D warnings
          cd "$GITHUB_WORKSPACE/crabefi-runtime-image"
          cargo +nightly -Z build-std=core,compiler_builtins,alloc \
            -Z build-std-features=compiler-builtins-mem \
            clippy --release --target x86_64-unknown-none -- -D warnings

  build:
    name: Build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: ./crabefi build --arch x86-64

      - name: Report reserved stack
        run: |
          stack_hex=$(readelf -SW target/x86_64-unknown-none/release/crabefi | awk '$3 == ".stack" { print $7 }')
          test -n "$stack_hex"
          printf '## x86_64 memory report\n\n- Reserved stack: %d KiB\n' "$((16#$stack_hex / 1024))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CrabEFI ELF
        uses: actions/upload-artifact@v7
        with:
          name: crabefi-elf
          path: |
            target/x86_64-unknown-none/release/crabefi
            target/runtime/x86_64/
          retention-days: 7

  # x86_64 Integration tests with QEMU
  test-usb:
    name: Test x86_64 (USB Storage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run integration tests (USB)
        run: |
          set -o pipefail
          ./crabefi test --app hello --disable-kvm --timeout 120 | tee qemu.log
          {
            echo '## Q35 runtime memory report'
            grep -F 'MEMORY_REPORT' qemu.log || true
          } >> "$GITHUB_STEP_SUMMARY"

  test-runtime-image:
    name: Test x86_64 (separate runtime image)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Validate runtime image boundary and variable services
        run: ./crabefi test --app runtime-image-test --disable-kvm --timeout 120

  test-ahci:
    name: Test x86_64 (AHCI Storage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run integration tests (AHCI)
        run: ./crabefi test --app hello --ahci --disable-kvm --timeout 120

  test-nvme:
    name: Test x86_64 (NVMe Storage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run integration tests (NVMe)
        run: ./crabefi test --app hello --nvme --disable-kvm --timeout 120

  test-sdhci:
    name: Test x86_64 (SD Card Storage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run integration tests (SDHCI)
        run: ./crabefi test --app hello --sdhci --disable-kvm --timeout 120

  test-rng:
    name: Test x86_64 (RNG Protocol)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run RNG protocol tests
        run: ./crabefi test --app rng-test --disable-kvm --timeout 120

  test-capsule:
    name: Test x86_64 (Capsule Update)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run capsule update tests
        run: ./crabefi test --app capsule-test --disable-kvm --timeout 120

  test-tcg:
    name: Test x86_64 (TCG Protocol)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils swtpm
          swtpm --version

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Run TCG protocol tests
        run: ./crabefi test --app tcg-test --disable-kvm --timeout 120

  # ── GRUB + Linux boot-chain ─────────────────────────────────────────

  build-boot-assets-x86_64:
    name: Build Boot Assets x86_64 (GRUB + Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore cached boot assets
        id: cache
        uses: actions/cache@v6
        with:
          path: boot-assets/x86_64
          key: boot-assets-x86_64-${{ hashFiles('ci/build-boot-assets.sh') }}

      - name: Set up Go (for u-root)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Install kernel build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libelf-dev \
              curl xz-utils grub-common grub-efi-amd64-bin

      - name: Build boot assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/build-boot-assets.sh --arch x86_64

      - name: Upload boot assets
        uses: actions/upload-artifact@v7
        with:
          name: boot-assets-x86_64
          path: boot-assets/x86_64/
          retention-days: 7

  build-boot-assets-aarch64:
    name: Build Boot Assets aarch64 (GRUB + Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore cached boot assets
        id: cache
        uses: actions/cache@v6
        with:
          path: boot-assets/aarch64
          key: boot-assets-aarch64-${{ hashFiles('ci/build-boot-assets.sh') }}

      - name: Set up Go (for u-root)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Install kernel build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libelf-dev \
              curl xz-utils grub-common gcc-aarch64-linux-gnu

      - name: Build boot assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/build-boot-assets.sh --arch aarch64

      - name: Upload boot assets
        uses: actions/upload-artifact@v7
        with:
          name: boot-assets-aarch64
          path: boot-assets/aarch64/
          retention-days: 7

  test-grub-linux:
    name: Test x86_64 (GRUB + Linux)
    runs-on: ubuntu-latest
    needs: [build, build-boot-assets-x86_64]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf
          path: target/x86_64-unknown-none/release/

      - name: Download boot assets
        uses: actions/download-artifact@v8
        with:
          name: boot-assets-x86_64
          path: boot-assets/x86_64/

      - name: Run GRUB + Linux boot-chain test
        run: ./crabefi test --app grub-linux --boot-assets-dir boot-assets/x86_64 --disable-kvm --timeout 180

  test-grub-linux-aarch64:
    name: Test aarch64/sbsa (GRUB + Linux)
    runs-on: ubuntu-latest
    needs: [build-aarch64, build-boot-assets-aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF (aarch64)
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf-aarch64
          path: target/aarch64-unknown-none/release/

      - name: Download boot assets
        uses: actions/download-artifact@v8
        with:
          name: boot-assets-aarch64
          path: boot-assets/aarch64/

      - name: Run GRUB + Linux boot-chain test (aarch64/sbsa)
        run: ./crabefi test --arch aarch64 --machine sbsa --app grub-linux --boot-assets-dir boot-assets/aarch64 --nvme --disable-kvm --timeout 180

  # ── aarch64 ───────────────────────────────────────────────────────────

  clippy-aarch64:
    name: Clippy (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src, llvm-tools-preview
          targets: aarch64-unknown-none

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Run clippy
        run: |
          ./crabefi build --arch aarch64 --machine sbsa
          RUNTIME_IMAGE_PATH="$PWD/target/runtime/aarch64/runtime.img" \
          RUNTIME_IMAGE_SHA256="$(tr -d '\n' < target/runtime/aarch64/sha256)" \
          cargo +nightly -Z build-std=core,compiler_builtins,alloc \
            -Z build-std-features=compiler-builtins-mem \
            clippy --workspace --release --target aarch64-unknown-none -- -D warnings
          cd "$GITHUB_WORKSPACE/crabefi-runtime-image"
          cargo +nightly -Z build-std=core,compiler_builtins,alloc \
            -Z build-std-features=compiler-builtins-mem \
            clippy --release --target aarch64-unknown-none -- -D warnings

  build-aarch64:
    name: Build (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: ./crabefi build --arch aarch64 --machine sbsa

      - name: Upload CrabEFI ELF (aarch64)
        uses: actions/upload-artifact@v7
        with:
          name: crabefi-elf-aarch64
          path: |
            target/aarch64-unknown-none/release/crabefi
            target/runtime/aarch64/
          retention-days: 7

  # aarch64 SBSA Integration tests with QEMU
  test-nvme-aarch64:
    name: Test aarch64/sbsa (NVMe Storage)
    runs-on: ubuntu-latest
    needs: build-aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none, aarch64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF (aarch64)
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf-aarch64
          path: target/aarch64-unknown-none/release/

      - name: Run integration tests (NVMe, aarch64/sbsa)
        run: ./crabefi test --arch aarch64 --machine sbsa --app hello --nvme --disable-kvm --timeout 120

  test-rng-aarch64:
    name: Test aarch64/sbsa (RNG Protocol)
    runs-on: ubuntu-latest
    needs: build-aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none, aarch64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF (aarch64)
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf-aarch64
          path: target/aarch64-unknown-none/release/

      - name: Run RNG protocol tests (aarch64/sbsa)
        run: ./crabefi test --arch aarch64 --machine sbsa --app rng-test --nvme --disable-kvm --timeout 120

  # ── aarch64 virt (FDT) ────────────────────────────────────────────────

  build-aarch64-virt:
    name: Build (aarch64/virt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Build release (virt PAYLOAD_BASE)
        run: ./crabefi build --arch aarch64 --machine virt

      - name: Upload CrabEFI ELF (aarch64-virt)
        uses: actions/upload-artifact@v7
        with:
          name: crabefi-elf-aarch64-virt
          path: |
            target/aarch64-unknown-none/release/crabefi
            target/runtime/aarch64/
          retention-days: 7

  test-nvme-aarch64-virt:
    name: Test aarch64/virt (NVMe Storage)
    runs-on: ubuntu-latest
    needs: build-aarch64-virt
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none, aarch64-unknown-uefi

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm mtools dosfstools zstd coreboot-utils

      - name: Download CrabEFI ELF (aarch64-virt)
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf-aarch64-virt
          path: target/aarch64-unknown-none/release/

      - name: Run integration tests (NVMe, aarch64/virt)
        run: ./crabefi test --arch aarch64 --machine virt --app hello --nvme --disable-kvm --timeout 120

  # ── riscv64 ──────────────────────────────────────────────────────────

  clippy-riscv64:
    name: Clippy (riscv64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src, llvm-tools-preview
          targets: riscv64gc-unknown-none-elf

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Run clippy
        run: |
          ./crabefi build --arch riscv64
          RUNTIME_IMAGE_PATH="$PWD/target/runtime/riscv64/runtime.img" \
          RUNTIME_IMAGE_SHA256="$(tr -d '\n' < target/runtime/riscv64/sha256)" \
          cargo +nightly -Z build-std=core,compiler_builtins,alloc \
            -Z build-std-features=compiler-builtins-mem \
            clippy --workspace --release --target riscv64gc-unknown-none-elf -- -D warnings
          cd "$GITHUB_WORKSPACE/crabefi-runtime-image"
          cargo +nightly -Z build-std=core,compiler_builtins,alloc \
            -Z build-std-features=compiler-builtins-mem \
            clippy --release --target riscv64gc-unknown-none-elf -- -D warnings

  build-riscv64:
    name: Build (riscv64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: riscv64gc-unknown-none-elf

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: ./crabefi build --arch riscv64

      - name: Show ELF info
        run: |
          ELF=target/riscv64gc-unknown-none-elf/release/crabefi
          file "$ELF"
          size "$ELF"

      - name: ELF to PE/COFF conversion (experimental)
        continue-on-error: true
        run: |
          # Rust has no riscv64gc-unknown-uefi target, so UEFI binaries
          # must be produced by converting the ELF to PE/COFF.  This uses
          # llvm-objcopy from the Rust toolchain (LLVM 18+, which added
          # pei-riscv64-little support).
          LLVM_OBJCOPY=$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-objcopy
          if [ ! -x "$LLVM_OBJCOPY" ]; then
            LLVM_OBJCOPY=$(which llvm-objcopy 2>/dev/null || true)
          fi
          ELF=target/riscv64gc-unknown-none-elf/release/crabefi
          PE="${ELF}.efi"
          if [ -n "$LLVM_OBJCOPY" ] && [ -x "$LLVM_OBJCOPY" ]; then
            echo "Using: $($LLVM_OBJCOPY --version | head -1)"
            "$LLVM_OBJCOPY" \
              --output-target=pei-riscv64-little \
              --subsystem=efi-application \
              "$ELF" "$PE" && \
            echo "PE/COFF created: $(stat -c%s "$PE") bytes" && \
            file "$PE" || \
            echo "::warning::llvm-objcopy pei-riscv64-little failed (LLVM may be too old)"
          else
            echo "::warning::llvm-objcopy not found, skipping PE/COFF conversion"
          fi

      - name: Upload CrabEFI ELF (riscv64)
        uses: actions/upload-artifact@v7
        with:
          name: crabefi-elf-riscv64
          path: |
            target/riscv64gc-unknown-none-elf/release/crabefi
            target/runtime/riscv64/
          retention-days: 7

  # riscv64 boot test with QEMU
  # No UEFI test apps (no riscv64gc-unknown-uefi target) — verifies CrabEFI
  # boots and initializes on coreboot + OpenSBI + QEMU virt.
  test-boot-riscv64:
    name: Test riscv64 (Boot)
    runs-on: ubuntu-latest
    needs: build-riscv64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: riscv64gc-unknown-none-elf

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc mtools dosfstools zstd coreboot-utils binutils-riscv64-linux-gnu

      - name: Download CrabEFI ELF (riscv64)
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf-riscv64
          path: target/riscv64gc-unknown-none-elf/release/

      - name: Run integration test (riscv64/virt)
        run: ./crabefi test --arch riscv64 --app hello --disable-kvm --timeout 120

  build-boot-assets-riscv64:
    name: Build Boot Assets riscv64 (GRUB + Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore cached boot assets
        id: cache
        uses: actions/cache@v6
        with:
          path: boot-assets/riscv64
          key: boot-assets-riscv64-${{ hashFiles('ci/build-boot-assets.sh') }}

      - name: Set up Go (for u-root)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Install kernel build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libelf-dev \
              curl xz-utils grub-common gcc-riscv64-linux-gnu

      - name: Build boot assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/build-boot-assets.sh --arch riscv64

      - name: Upload boot assets
        uses: actions/upload-artifact@v7
        with:
          name: boot-assets-riscv64
          path: boot-assets/riscv64/
          retention-days: 7

  test-grub-linux-riscv64:
    name: Test riscv64 (GRUB + Linux)
    runs-on: ubuntu-latest
    needs: [build-riscv64, build-boot-assets-riscv64]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: riscv64gc-unknown-none-elf

      - name: Install stable toolchain for xtask
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc mtools dosfstools zstd coreboot-utils binutils-riscv64-linux-gnu

      - name: Download CrabEFI ELF (riscv64)
        uses: actions/download-artifact@v8
        with:
          name: crabefi-elf-riscv64
          path: target/riscv64gc-unknown-none-elf/release/

      - name: Download boot assets
        uses: actions/download-artifact@v8
        with:
          name: boot-assets-riscv64
          path: boot-assets/riscv64/

      - name: Run GRUB + Linux boot-chain test (riscv64/virt)
        run: ./crabefi test --arch riscv64 --app grub-linux --boot-assets-dir boot-assets/riscv64 --disable-kvm --timeout 180
