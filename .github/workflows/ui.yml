name: UI
on:
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    name: Setup UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Tests and lint
        run: |
          cargo fmt --manifest-path ui-harness/Cargo.toml -- --check
          cargo test --locked -p crabefi-ui --features screens,secure-boot,cfr
          cargo test --locked --manifest-path ui-harness/Cargo.toml
          cargo clippy --locked -p crabefi-ui \
            --all-features --all-targets -- -D warnings
          cargo clippy --locked --manifest-path ui-harness/Cargo.toml \
            --all-targets -- -D warnings
      - name: Screenshots
        run: |
          mkdir -p target/ui-shots
          for scenario in normal cfr secure empty; do
            cargo run --locked --manifest-path ui-harness/Cargo.toml \
              --example shot -- --scenario "$scenario" \
              "target/ui-shots/$scenario.png" > /dev/null
          done
      - name: Upload screenshots
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crabefi-ui-screenshots
          path: target/ui-shots/
          retention-days: 7

  browser:
    name: Browser demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Read the wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          rustup target add wasm32-unknown-unknown
          echo "version=$(bash ui-harness/build.sh --wasm-bindgen-version)" \
            >> "$GITHUB_OUTPUT"
      # taiki-e/install-action v2
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}
      - name: Build the site
        run: bash ui-harness/build.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui-harness/package-lock.json
      - name: Smoke test in Chromium
        working-directory: ui-harness
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
          npm test
      - name: Upload Pages site
        if: >-
          github.event_name != 'pull_request' &&
          github.ref_type == 'branch' &&
          github.ref_name == github.event.repository.default_branch
        # actions/upload-pages-artifact v5
        uses: >-
          actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: target/ui-harness-site/
      - name: Upload the site for review
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crabefi-ui-browser
          path: target/ui-harness-site/
          retention-days: 7

  deploy:
    name: Publish browser demo to GitHub Pages
    needs: [native, browser]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        # actions/configure-pages v6
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
