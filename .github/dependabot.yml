# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
  - package-ecosystem: "nix"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
