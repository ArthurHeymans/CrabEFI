[package]
name = "crabefi-core"
version = "0.1.0"
edition.workspace = true
authors = ["CrabEFI Contributors"]
description = "A platform-agnostic UEFI implementation library"
license.workspace = true
repository.workspace = true
readme = "../README.md"

[features]
default = []
# Capabilities are additive; external firmware opts into its exact hardware set.
xhci = ["dep:xhci"]
# TPM devices, TCG protocols, event tables and measured boot.
tpm = ["dep:sha1"]
# UEFI image/key authentication, independent of a host firmware's signed FFS.
secure-boot = ["pkcs7", "crabefi-runtime-bundle?/secure-boot"]
# Signed firmware capsule application requires durable result persistence.
capsule-update = ["pkcs7", "variable-store"]
# Shared verification implementation, not a runtime policy switch.
pkcs7 = ["sha2/oid", "dep:sha1", "dep:rsa", "dep:x509-cert", "dep:der", "dep:const-oid", "dep:signature", "dep:cms"]
# Preserve the standalone payload's existing non-graphical capabilities explicitly.
full = ["tpm", "xhci", "spi-flash", "secure-boot", "capsule-update"]
# Direct flash variable persistence; omitted when the host provides no flash store.
variable-store = []
spi-flash = ["variable-store", "dep:rflasher-core", "dep:rflasher-internal"]
# Embed the checked, architecture-matched Runtime Services image so external
# firmware can integrate CrabEFI using Cargo alone.
bundled-runtime-image = ["dep:crabefi-runtime-bundle"]
# Enable linker-symbol-backed runtime regions used by CrabEFI-owned payloads.
# Disable when linking CrabEFI as a library into external firmware.
platform-entry = []
# Register the built-in BumpAllocator as #[global_allocator].
# Disable this if the linking binary provides its own allocator.
global-allocator = []
# Enable logging output to framebuffer (very slow, for debugging only)
fb-log = []
# Enable graphical UI with mouse support (PS/2 and USB HID mouse drivers,
# cursor rendering, SimplePointerProtocol, and graphical setup utility)
ui = ["dep:noto-sans-mono-bitmap"]

[dependencies]
crabefi-efi-types = { workspace = true }
crabefi-runtime-bundle = { workspace = true, optional = true }
crabefi-runtime-abi = { path = "../crabefi-runtime-abi" }
r-efi = { workspace = true }
log = { workspace = true }
heapless = { workspace = true }
linked_list_allocator = { version = "0.10.6", default-features = false, features = ["use_spin"] }
mem-barrier = { workspace = true }
pci_types = { workspace = true }
xhci = { workspace = true, optional = true }
object = { workspace = true }
bitflags = "2"
atomic_refcell = "0.1"
spin = "0.12"
noto-sans-mono-bitmap = { optional = true, version = "0.3", default-features = false, features = [
  "regular",
  "size_16",
  "size_20",
  "size_24",
  "size_32",
  "unicode-basic-latin",
] }
tock-registers = "0.10"
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
rflasher-core = { optional = true, git = "https://github.com/ArthurHeymans/rflasher.git", rev = "a06d37b6c45a59b68a3a01b7b8abee73a10ea8a0", default-features = false, features = [
  "is_sync",
] }
rflasher-internal = { optional = true, git = "https://github.com/ArthurHeymans/rflasher.git", rev = "a06d37b6c45a59b68a3a01b7b8abee73a10ea8a0", default-features = false, features = [
  "is_sync",
] }

# RustCrypto crates for UEFI Secure Boot authentication (all no_std compatible)
sha1 = { optional = true, version = "0.10", default-features = false, features = ["force-soft"] }
sha2 = { version = "0.10", default-features = false, features = [
  "force-soft",
] }
rsa = { optional = true, version = "0.9", default-features = false }
x509-cert = { optional = true, version = "0.3", default-features = false }
der = { optional = true, version = "0.8", default-features = false }
const-oid = { optional = true, version = "0.10", default-features = false }
signature = { optional = true, version = "3.0", default-features = false }
cms = { optional = true, version = "=0.3.0-pre.2", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"

# FDT parsing is needed on aarch64 (QEMU virt, SBSA) and riscv64 (OpenSBI
# passes FDT in a1). Not needed on x86_64 (ACPI-only).
[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
fdt = "0.1.5"

[lib]
# Keep the Rust crate name as `crabefi` during the migration so downstream
# code can depend on package `crabefi-core` as `crabefi` without a large rename.
name = "crabefi"
path = "src/lib.rs"
