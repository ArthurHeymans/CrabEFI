[package]
name = "crabefi-core"
version = "0.1.0"
edition.workspace = true
authors = ["CrabEFI Contributors"]
description = "A platform-agnostic UEFI implementation library"
license.workspace = true
repository.workspace = true
readme = "../README.md"

[features]
default = []
# Include CrabEFI's own _start entry point, EL2 page table setup,
# and exception vector table. Disable when linking CrabEFI as a
# library into an external firmware (e.g., fstart) that provides
# its own entry point and exception handling.
platform-entry = []
# Register the built-in BumpAllocator as #[global_allocator].
# Disable this if the linking binary provides its own allocator.
global-allocator = []
# Enable logging output to framebuffer (very slow, for debugging only)
fb-log = []
# Enable runtime services serial debug logging (post-SetVirtualAddressMap)
rt-debug = []
# Enable runtime services log buffer (records SetVariable calls after
# ExitBootServices into a warm-reboot-persistent ring buffer; requires
# _rt_log_start/_rt_log_end linker symbols)
rt-log = []
# Enable graphical UI with mouse support (PS/2 and USB HID mouse drivers,
# cursor rendering, SimplePointerProtocol, and rlvgl-based setup utility)
ui = []

[dependencies]
r-efi = { workspace = true }
log = { workspace = true }
heapless = { workspace = true }
bitflags = "2"
atomic_refcell = "0.1"
spin = "0.9"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = [
  "regular",
  "size_16",
  "size_20",
  "size_24",
  "size_32",
  "unicode-basic-latin",
] }
tock-registers = "0.10"
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
rflasher-core = { git = "https://github.com/ArthurHeymans/rflasher.git", rev = "2f0b625865c0a530b3f151166be95319543e2aff", default-features = false, features = [
  "is_sync",
] }
rflasher-internal = { git = "https://github.com/ArthurHeymans/rflasher.git", rev = "2f0b625865c0a530b3f151166be95319543e2aff", default-features = false, features = [
  "is_sync",
] }

# RustCrypto crates for UEFI Secure Boot authentication (all no_std compatible)
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }
sha2 = { version = "0.10", default-features = false, features = [
  "oid",
  "force-soft",
] }
rsa = { version = "0.9", default-features = false }
x509-cert = { version = "0.2", default-features = false }
der = { version = "0.7", default-features = false }
const-oid = { version = "0.9", default-features = false }
signature = { version = "2.2", default-features = false }
cms = { version = "0.2", default-features = false }
spki = { version = "0.7", default-features = false }

# Serialization for variable store
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "alloc",
] }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"

# FDT parsing is needed on aarch64 (QEMU virt, SBSA) and riscv64 (OpenSBI
# passes FDT in a1). Not needed on x86_64 (ACPI-only).
[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
fdt = "0.1.5"

[lib]
# Keep the Rust crate name as `crabefi` during the migration so downstream
# code can depend on package `crabefi-core` as `crabefi` without a large rename.
name = "crabefi"
path = "src/lib.rs"
