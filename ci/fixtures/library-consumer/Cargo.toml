[package]
name = "crabefi-library-consumer"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[dependencies]
crabefi = { package = "crabefi-core", path = "../../../crabefi-core", features = ["bundled-runtime-image"] }
linked_list_allocator = { version = "0.10.6", default-features = false, features = ["use_spin"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1